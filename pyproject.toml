[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-autobench"
version = "0.1.0"
description = "Resumable SSH performance testing across UEFI Linux installations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["asyncssh>=2.20,<3", "python-socks[asyncio]>=2.4.3,<3", "typer>=0.15,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
autobench = "autobench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured SSH/systemd host", "uefi: reboots an explicitly configured multi-OS machine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
